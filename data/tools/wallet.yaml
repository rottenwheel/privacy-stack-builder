- id: monerujo
  name: Monerujo
  category: wallet
  platforms: [android]
  jurisdiction: none
  url: https://www.monerujo.app
  criteria: [foss, no-account, offline]
  why: Mature Android wallet with Tor support and node switching.
  warn: Android only.
- id: monero-com
  name: Monero.com
  category: wallet
  platforms: [android, ios]
  jurisdiction: US
  url: https://monero.com
  criteria: [foss, no-account, offline]
  why: Cake Wallet's Monero-only build. Simplest onboarding for phones.
  warn: Defaults to Cake's nodes; set your own.
- id: cake
  name: Cake Wallet
  category: wallet
  platforms: [android, ios, linux, macos, windows]
  jurisdiction: US
  url: https://cakewallet.com
