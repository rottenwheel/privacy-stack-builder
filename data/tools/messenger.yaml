- id: simplex
  name: SimpleX Chat
  category: messenger
  platforms: [android, ios, linux, macos, windows]
  jurisdiction: GB
  url: https://simplex.chat
  criteria: [foss, e2ee, no-phone, no-account, selfhost, audit, repro]
  why: No user identifiers at all, not even random ones. Relays can be self-hosted.
  warn: Small user base; multi-device sync is limited.
- id: signal
  name: Signal
  category: messenger
  platforms: [android, ios, linux, macos, windows]
  jurisdiction: US
  url: https://signal.org
  criteria: [foss, e2ee, audit, repro]
  why: Best crypto with mass adoption. The one you can get family onto.
  warn: Phone number required at signup. Centralized servers in the US.
- id: session
  name: Session
  category: messenger
  platforms: [android, ios, linux, macos, windows]
  jurisdiction: CH
  url: https://getsession.org
  criteria: [foss, e2ee, no-phone, no-account]
  why: No phone number, onion-routed over a decentralized node network.
  warn: Dropped forward secrecy and deniability in its protocol; weaker than Signal crypto.
- id: threema
  name: Threema
  category: messenger
  platforms: [android, ios, web]
  jurisdiction: CH
  url: https://threema.ch
  criteria: [foss, e2ee, no-phone, audit]
  why: Swiss company and servers, one-time payment, no phone number needed. Popular in DACH.
  warn: "Owned by German private equity since 2020 (Afinum, then Comitis Capital from January 2026); lost the Swiss Hosting label in April 2026. Server side is closed source. Paid app."
- id: briar
  name: Briar
  category: messenger
  platforms: [android]
  jurisdiction: DE
  url: https://briarproject.org
  criteria: [foss, e2ee, no-phone, no-account, audit, offline]
  why: Peer-to-peer over Tor, Wi-Fi or Bluetooth. Works with the internet down.
  warn: Android only. Both parties must be online to deliver messages.
- id: element
  name: Element (Matrix)
  category: messenger
  platforms: [android, ios, linux, macos, windows, web]
  jurisdiction: GB
  url: https://element.io
  criteria: [foss, e2ee, no-phone, selfhost, audit]
  why: Federated, self-hostable, bridges to everything.
  warn: Metadata (room membership, reactions) is not encrypted and spreads across federated servers.
- id: deltachat
  name: Delta Chat
  category: messenger
  platforms: [android, ios, linux, macos, windows]
  jurisdiction: DE
  url: https://delta.chat
  criteria: [foss, e2ee, no-phone, selfhost, audit]
  why: Chat over email. Any address works, or use its own chatmail relays with no signup data.
  warn: Metadata (who mails whom) visible to mail servers unless both use chatmail relays.
- id: molly
  name: Molly
  category: messenger
  platforms: [android]
  jurisdiction: none
  url: https://molly.im
  criteria: [foss, e2ee, audit, repro]
  why: "Hardened Signal fork: encrypted database at rest, Tor via Orbot, no Google push in the FOSS build."
  warn: Still Signal's network, so still needs a phone number.
- id: cwtch
  name: Cwtch
  category: messenger
  platforms: [android, linux, macos, windows]
  jurisdiction: CA
  url: https://cwtch.im
  criteria: [foss, e2ee, no-phone, no-account, offline]
  why: Every conversation is a Tor onion service. No servers, no metadata.
  warn: Both sides online for delivery unless you run an untrusted relay server.
