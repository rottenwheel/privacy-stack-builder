- id: tor-browser
  name: Tor Browser
  category: browser
  platforms: [android, linux, macos, windows]
  jurisdiction: US
  url: https://www.torproject.org
  criteria: [foss, no-account, no-telemetry, audit, repro]
  why: For anything sensitive. Anonymity set of every other Tor user.
  warn: Slow. Never log into personal accounts through it.
- id: brave
  name: Brave
  category: browser
  platforms: [android, ios, linux, macos, windows]
