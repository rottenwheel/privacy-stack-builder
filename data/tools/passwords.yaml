- id: bitwarden
  name: Bitwarden
  category: passwords
  platforms: [android, ios, linux, macos, windows, web]
  jurisdiction: US
  url: https://bitwarden.com
  criteria: [foss, e2ee, audit, selfhost]
  why: Best cross-platform clients. Point them at your own Vaultwarden.
  warn: Default cloud is in the US. Self-host the server to keep control.
- id: vaultwarden
  name: Vaultwarden (server)
  category: passwords
  platforms: [linux]
  jurisdiction: none
  url: https://github.com/dani-garcia/vaultwarden
  criteria: [foss, e2ee, selfhost]
  why: Lightweight Bitwarden-compatible server. Your vault, your server.
  warn: Unofficial reimplementation. You own backups and updates.
- id: keepassxc
  name: KeePassXC
  category: passwords
  platforms: [linux, macos, windows]
  jurisdiction: none
  url: https://keepassxc.org
  criteria: [foss, e2ee, no-account, offline, audit]
  why: One encrypted file, no server, no account. Pair with KeePassDX on Android.
  warn: Sync is your problem (Syncthing, WebDAV).
- id: proton-pass
  name: Proton Pass
  category: passwords
  platforms: [android, ios, linux, macos, windows, web]
  jurisdiction: CH
  url: https://proton.me/pass
  criteria: [foss, e2ee, audit]
  why: Swiss, built-in email aliases, audited clients.
  warn: Proton account required. Not self-hostable.
- id: keepassdx
  name: KeePassDX
  category: passwords
  platforms: [android]
  jurisdiction: none
  url: https://www.keepassdx.com
  criteria: [foss, e2ee, no-account, offline]
  why: Android companion to KeePassXC. Same database file, autofill, biometrics.
  warn: Android only. Sync the file with Syncthing.
