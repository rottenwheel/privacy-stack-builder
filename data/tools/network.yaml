- id: mullvad
  name: Mullvad VPN
  category: network
  platforms: [android, ios, linux, macos, windows]
  jurisdiction: SE
  url: https://mullvad.net
  criteria: [foss, no-account, xmr, audit, no-telemetry, repro]
  why: Numbered accounts, no email, pays in Monero or cash. Diskless servers, audited.
  warn: Port forwarding removed. Flat price, no discounts.
- id: ivpn
  name: IVPN
  category: network
  platforms: [android, ios, linux, macos, windows]
  jurisdiction: GI
  url: https://www.ivpn.net
  criteria: [foss, no-account, xmr, audit, no-telemetry]
  why: Same no-email model as Mullvad, Monero accepted, audited. Good backup provider.
  warn: Smaller server fleet.
- id: protonvpn
  name: Proton VPN
  category: network
  platforms: [android, ios, linux, macos, windows]
  jurisdiction: CH
  url: https://protonvpn.com
  criteria: [foss, audit, no-telemetry]
  why: Swiss, audited, free tier for the budget-constrained.
  warn: Account required. Monero not accepted (Bitcoin and cash are).
- id: nymvpn
  name: NymVPN
  category: network
  platforms: [android, ios, linux, macos, windows]
  jurisdiction: CH
  url: https://nym.com
  criteria: [foss, xmr, no-telemetry]
  why: Mixnet mode adds timing obfuscation that plain VPNs and Tor lack. Pays in Monero.
  warn: Young project. Mixnet mode is slow; use for messaging, not streaming.
- id: invizible
  name: InviZible Pro
  category: network
  platforms: [android]
  jurisdiction: none
  url: https://invizible.net
  criteria: [foss, no-account, no-telemetry, offline]
  why: DNSCrypt, Tor and I2P in one Android app. Encrypted DNS for every app.
  warn: Android only. Conflicts with a VPN app unless configured in proxy mode.
- id: rethinkdns
  name: Rethink DNS
  category: network
  platforms: [android]
  jurisdiction: none
  url: https://rethinkdns.com
  criteria: [foss, no-account, no-telemetry, offline]
  why: Per-app firewall plus encrypted DNS, no root needed.
  warn: Android only. Uses the VPN slot, so pair with WireGuard config inside it.
- id: orbot
  name: Orbot
  category: network
  platforms: [android, ios]
  jurisdiction: US
  url: https://orbot.app
  criteria: [foss, no-account, no-telemetry]
  why: Tor for the whole phone or per app. Bridges built in for censored networks.
  warn: Not a VPN replacement for speed. Uses the VPN slot on Android.
- id: wireguard
  name: WireGuard (self-hosted)
  category: network
  platforms: [android, ios, linux, macos, windows]
  jurisdiction: none
  url: https://www.wireguard.com
  criteria: [foss, no-account, selfhost, no-telemetry, audit]
  why: Your own VPN on a cheap VPS. Hides traffic from the local network, not from the VPS provider.
  warn: A single-user VPN is trivially linkable to you. Use for trusted-network access, not anonymity.
- id: netguard
  name: NetGuard
  category: network
  platforms: [android]
  jurisdiction: NL
  url: https://netguard.me
  criteria: [foss, no-account, no-telemetry, offline]
  why: Per-app firewall without root. Block an app's network entirely.
  warn: Occupies the VPN slot, so it conflicts with VPN apps.
