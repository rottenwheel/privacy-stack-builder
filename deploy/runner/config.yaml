# act_runner configuration. Generated defaults trimmed to what matters here.
# Reference: act_runner generate-config
log:
  level: info
runner:
  file: /data/.runner
  capacity: 1
  timeout: 20m
  fetch_timeout: 5s
  fetch_interval: 2s
cache:
  enabled: true
  dir: /data/cache
container:
  network: ""
  privileged: false
  options: ""
  workdir_parent: ""
  valid_volumes: []
  docker_host: ""
  force_pull: true
host:
  workdir_parent: ""
